	// ==================== 語言切換 ====================
	function applyLanguage(lang) {
	  currentLang = lang;
	  const t = translations[lang];
	  if (!t) return;
	  try {
	    document.querySelectorAll('[data-i18n]').forEach(el => {
	      const key = el.getAttribute('data-i18n');
	      if (t[key]) el.textContent = t[key];
	    });
	    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
	      const key = el.getAttribute('data-i18n-ph');
	      if (t[key]) el.placeholder = t[key];
	    });
	    const titleEl = document.getElementById('termsTitleText');
	    if (titleEl && t.termsTitle) titleEl.textContent = t.termsTitle;
	    ['zh-HK','zh-CN','en-US'].forEach(l => {
	      const el = document.getElementById('terms-' + l);
	      if (el) el.style.display = (l === lang) ? 'block' : 'none';
	    });
	    document.getElementById('langSelect').value = lang;
	    updateAgreeBtnText();
	    if (typeof gameState !== 'undefined' && gameState && gameState.lastGuess && gameState.current) renderGameResult(gameState.lastGuess, false);
	    if (typeof updateTierDisplay === 'function') updateTierDisplay(false);
	    if (typeof updatePnlDisplay === 'function') updatePnlDisplay();
	    if (typeof updateSkipDisplay === 'function') updateSkipDisplay();
	    if (window._lastResult) {
	      const r = window._lastResult;
	      let text = "";
	      if (r.className === 'result-error') {
	        if (r.errKey === 'incomplete') text = t.errIncomplete;
	        else if (r.errKey === 'over100') text = t.errOver100;
	        else text = t.errIncomplete;
	        showResult(text, r.className, r.layer, r.bet, r.ev, r.isReverse, r.errKey);
	        return;
	      }
	      if (r.bet === "H") text = t.resultH;
	      else if (r.bet === "A") text = t.resultA;
	      else if (r.bet === "D") text = t.resultD;
	      else text = t.resultSkip;
	      showResult(text, r.className, r.layer, r.bet, r.ev, r.isReverse);
	    }
	  } catch(e) { console.error('applyLanguage error:', e); }
	}
	function changeLang(lang) { applyLanguage(lang); }
	
	// ==================== 輸入處理 ====================
	function formatOddsInput(input) {
	  let val = input.value.replace(/[^0-9.]/g, '');
	  const parts = val.split('.');
	  if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
	  input.value = val;
	}
	function formatOddsOnBlur(input) {
	  let val = input.value.trim();
	  if (val === '' || val === '.') return;
	  let num = parseFloat(val);
	  if (isNaN(num)) return;
	  input.value = num.toFixed(2);
	}

	  const ids = ['hw','dw','aw','ho','doo','ao'];

	  const clearBtn = document.getElementById('clearBtn');
	  if (clearBtn) clearBtn.style.display = allEmpty ? 'none' : 'block';
	}

	  return fetch(url).then(res => res.text()).then(text => {
	    const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
	    const cell = json.table.rows[0]?.c[0];
	    return cell ? (cell.f !== undefined ? cell.f : cell.v) : null;
	  });
	}
	var statsLoadFailed = 0;
	function loadStatsWithRetry() {
	  statsLoadFailed = 0;
	  var okCount = 0, totalCount = 7;
	  function checkDone() { okCount++; if (okCount === totalCount) statsLoadFailed = 0; }
	  function checkFail() { statsLoadFailed++; if (statsLoadFailed >= 3) { statsLoadFailed = 0; setTimeout(loadStatsWithRetry, 3000); } }
	  fetchCell('L7').then(v => {
	    if (v === null || v === undefined) { checkDone(); return; }
	    const num = Number(String(v).replace(/,/g, ''));
	    const el = document.getElementById('stat-pnl');

	    else if (num < 0) { el.textContent = v; el.className = 'value negative'; }

	    checkDone();

	  fetchCell('L8').then(v => { document.getElementById('stat-cost').textContent = v !== null ? v : '—'; checkDone(); }).catch(checkFail);
	  fetchCell('L10').then(v => { document.getElementById('stat-bets').textContent = v !== null ? v : '—'; checkDone(); }).catch(checkFail);
	  fetchCell('L11').then(v => { document.getElementById('stat-wins').textContent = v !== null ? v : '—'; checkDone(); }).catch(checkFail);
	  fetchCell('M2').then(v => { document.getElementById('stat-update-date').textContent = v !== null ? v : '—'; checkDone(); }).catch(checkFail);
	  fetchCell('L9').then(v => {
	    const el = document.getElementById('stat-roi');
	    if (v === null || v === undefined || v === '') { checkDone(); return; }
	    let numVal; let strVal = String(v).trim();
	    if (strVal.includes('%')) { numVal = parseFloat(strVal.replace('%', '')); }
	    else { numVal = parseFloat(strVal); if (!isNaN(numVal) && Math.abs(numVal) <= 1 && numVal !== 0) numVal = numVal * 100; }
	    if (isNaN(numVal)) { checkDone(); return; }
	    el.textContent = (numVal > 0 ? '+' : '') + numVal.toFixed(2) + '%';
	    el.className = 'value ' + (numVal > 0 ? 'positive' : numVal < 0 ? 'negative' : 'neutral');
	    checkDone();
	  }).catch(checkFail);
	  fetchCell('L12').then(v => {

	    if (strVal.includes('%')) { numVal = parseFloat(strVal.replace('%', '')); }
	    else { numVal = parseFloat(strVal); if (!isNaN(numVal) && Math.abs(numVal) <= 1 && numVal !== 0) numVal = numVal * 100; }
	    if (isNaN(numVal)) { checkDone(); return; }

	// ==================== 讀取賽果 Pool (A2:H) ====================
	var sheetMatchPool = null;
	var sheetPoolPromise = null;
	var sheetPoolUpdatedAt = 0;
	
	function normalizeResult(v) {
	  if (v === null || v === undefined) return null;
	  var s = String(v).trim().toUpperCase();
	  if (!s) return null;
	  if (s === 'H' || s === '3' || s === '主' || s === '主勝' || s === '主胜' || s === 'HOME' || s === 'W' || s === 'WIN') return 'H';
	  if (s === 'D' || s === '1' || s === '和' || s === '和局' || s === 'DRAW' || s === 'X') return 'D';
	  if (s === 'A' || s === '0' || s === '客' || s === '客勝' || s === '客胜' || s === 'AWAY' || s === 'L' || s === 'LOSE') return 'A';
	  return null;
	}
	
	function parseSheetMatchRow(row) {
	  if (!row || !row.c) return null;
	  function rawCell(idx) {
	    var c = row.c[idx];
	    if (!c) return null;
	    return c.v !== undefined && c.v !== null ? c.v : (c.f !== undefined ? c.f : null);
	  }
	  function numCell(idx) {
	    var v = rawCell(idx);
	    if (v === null || v === '') return null;
	    var n = Number(String(v).replace(/,/g, '').replace('%', '').trim());
	    return isNaN(n) ? null : n;
	  }
	  var hw = numCell(0), dw = numCell(1), aw = numCell(2);
	  var ho = numCell(3), doo = numCell(4), ao = numCell(5);
	  var scoreRaw = rawCell(6);
	  var resultRaw = rawCell(7);
	  if (hw === null || dw === null || aw === null) return null;
	  if (ho === null || doo === null || ao === null) return null;
	  // 勝率若為小數 (0.xx) 自動轉為百分數
	  if (hw > 0 && hw <= 1) hw *= 100;
	  if (dw > 0 && dw <= 1) dw *= 100;
	  if (aw > 0 && aw <= 1) aw *= 100;
	  // 賠率一律轉為整數形式（原公式用 158 表示 1.58）
	  var hoInt  = Math.round(ho * 100);
	  var dooInt = Math.round(doo * 100);
	  var aoInt  = Math.round(ao * 100);
	  var result = normalizeResult(resultRaw);
	  if (!result) return null;
	  // 過濾明顯不合理的數據
	  if (hoInt < 100 || hoInt > 10000) return null;
	  if (dooInt < 100 || dooInt > 10000) return null;
	  if (aoInt < 100 || aoInt > 10000) return null;
	  return {
	    hw: Math.round(hw),
	    dw: Math.round(dw),
	    aw: Math.round(aw),
	    ho: hoInt,
	    doo: dooInt,
	    ao: aoInt,
	    score: scoreRaw !== null && scoreRaw !== '' ? String(scoreRaw).trim() : '',
	    result: result
	  };
	}
	
	function fetchSheetMatches() {
	  var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(SHEET_NAME) + '&range=A2:H&t=' + Date.now();
	  return fetch(url).then(function(res) { return res.text(); }).then(function(text) {
	    var json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
	    var rows = (json.table && json.table.rows) ? json.table.rows : [];
	    var pool = [];
	    rows.forEach(function(row) {
	      var m = parseSheetMatchRow(row);
	      if (m) pool.push(m);
	    });
	    sheetMatchPool = pool;
	    sheetPoolUpdatedAt = Date.now();
	    return pool;
	  });
	}
	
	function ensureSheetPool(forceRefresh) {
	  if (!forceRefresh && sheetMatchPool && sheetMatchPool.length > 0) {
	    return Promise.resolve(sheetMatchPool);
	  }
	  if (sheetPoolPromise) return sheetPoolPromise;
	  sheetPoolPromise = fetchSheetMatches().then(function(pool) {
	    sheetPoolPromise = null;
	    return pool;
	  }).catch(function(e) {
	    sheetPoolPromise = null;
	    throw e;
	  });
	  return sheetPoolPromise;
	}
	
	// ==================== 公式 ====================
	function calcBet(hw, dw, aw, ho, doo, ao) {
	  if (Math.abs(hw - aw) <= PARAMS.p1_gap) return "D";
	  if (hw >= PARAMS.p2_hmin && ho >= PARAMS.p2_dmin/100 && ho < PARAMS.p2_dmax/100 && ho !== ao) return "H";
	  if (hw >= PARAMS.p3_hmin && ho > PARAMS.p3_dmin/100 && ho <= PARAMS.p3_dmax/100 && ho !== ao) return "D";
	  if (aw > hw && ao > ho && ao < PARAMS.p4_fmax/100) return "H";
	  if (aw > hw && ao >= PARAMS.p5_fmin/100 && ao <= PARAMS.p5_fmax/100) return "A";
	  if (ho > ao) {
	    if (hw >= PARAMS.pb_hmin && ho >= PARAMS.pb_dmin/100) return "D";
	    return "H";
	  } else if (ao > ho) {
	    if (ao >= PARAMS.pb_fskip/100) return "skip";
	    return "A";
	  } else {
	    if (hw > aw) return "H";
	    if (aw > hw) return "A";
	    return "skip";
	  }
	}
	function calcLayer(hw, dw, aw, ho, doo, ao) {
	  if (Math.abs(hw - aw) <= PARAMS.p1_gap) return 1;
	  if (hw >= PARAMS.p2_hmin && ho >= PARAMS.p2_dmin/100 && ho < PARAMS.p2_dmax/100 && ho !== ao) return 2;
	  if (hw >= PARAMS.p3_hmin && ho > PARAMS.p3_dmin/100 && ho <= PARAMS.p3_dmax/100 && ho !== ao) return 3;
	  if (aw > hw && ao > ho && ao < PARAMS.p4_fmax/100) return 4;
	  if (aw > hw && ao >= PARAMS.p5_fmin/100 && ao <= PARAMS.p5_fmax/100) return 5;
	  return 6;
	}
	
	function calculate() {
	  const t = translations[currentLang];
	  let hwVal = document.getElementById('hw').value.trim();
	  let dwVal = document.getElementById('dw').value.trim();
	  let awVal = document.getElementById('aw').value.trim();
	  let hoVal = document.getElementById('ho').value.trim();
	  let dooVal = document.getElementById('doo').value.trim();
	  let aoVal = document.getElementById('ao').value.trim();
	  if (hwVal === '' || dwVal === '' || awVal === '' || hoVal === '' || dooVal === '' || aoVal === '') {
	    showResult(t.errIncomplete, "result-error", 0, "skip", null, false, 'incomplete'); return;
	  }
	  let hw = Number(hwVal), dw = Number(dwVal), aw = Number(awVal);
	  let ho = Number(hoVal), doo = Number(dooVal), ao = Number(aoVal);
	  if (isNaN(hw) || isNaN(dw) || isNaN(aw) || isNaN(ho) || isNaN(doo) || isNaN(ao)) {
	    showResult(t.errIncomplete, "result-error", 0, "skip", null, false, 'incomplete'); return;
	  }
	  if (hw + dw + aw > 100) { showResult(t.errOver100, "result-error", 0, "skip", null, false, 'over100'); return; }
	  var bet = calcBet(hw, dw, aw, ho, doo, ao);
	  var layer = calcLayer(hw, dw, aw, ho, doo, ao);
	  var isReverse = false;
	  if (layer === 6 && ho > ao && hw >= PARAMS.pb_hmin && ho >= PARAMS.pb_dmin/100) isReverse = true;
	  let text = "", className = "", ev = null;
	  if (bet === "H") { text = t.resultH; className = "result-H"; ev = (hw / 100) * ho - 1; }
	  else if (bet === "A") { text = t.resultA; className = "result-A"; ev = (aw / 100) * ao - 1; }
	  else if (bet === "D") { text = t.resultD; className = "result-D"; ev = (dw / 100) * doo - 1; }
	  else { text = t.resultSkip; className = "result-skip"; }
	  showResult(text, className, layer, bet, ev, isReverse);
	}
	
	function showResult(text, className, layer, bet, ev, isReverse, errKey) {
	  let resultBox = document.getElementById('resultBox');
	  resultBox.style.display = 'block';
	  resultBox.className = "result-box " + className;
	  resultBox.innerText = text;
	  let evBox = document.getElementById('evBox');
	  let hintBox = document.getElementById('hintBox');
	  if (className === 'result-error') {
	    evBox.style.display = 'none'; hintBox.style.display = 'none'; hintBox.innerText = '';
	    window._lastResult = { text, className, layer, bet, ev, isReverse, errKey };
	    return;
	  }
	  const t = translations[currentLang];
	  if (ev !== null && ev !== undefined && !isNaN(ev)) {
	    const evPercent = (ev * 100).toFixed(2);
	    const sign = ev >= 0 ? '+' : '';
	    const colorClass = ev >= 0 ? 'ev-positive' : 'ev-negative';
	    evBox.innerHTML = t.evLabel + '<span class="' + colorClass + '">' + sign + evPercent + '%</span>';
	    evBox.style.display = 'block';
	  } else evBox.style.display = 'none';
	  let hintText = '';
	  if (bet === "skip") hintText = t.hintSkip;
	  else if (isReverse) hintText = t.hintReverse;
	  else {
	    switch(layer) {
	      case 1: hintText = t.hint1; break; case 2: hintText = t.hint2; break;
	      case 3: hintText = t.hint3; break; case 4: hintText = t.hint4; break;
	      case 5: hintText = t.hint5; break; case 6: hintText = t.hint6; break;
	    }
	  }
	  hintBox.innerText = hintText;
	  hintBox.style.display = hintText ? 'block' : 'none';
	  window._lastResult = { text, className, layer, bet, ev, isReverse };
	}
	
	function clearData() {
	  ['hw','dw','aw','ho','doo','ao'].forEach(id => { var el = document.getElementById(id); if (el) el.value = ''; });

	  checkClearBtn();
	}

	// ==================== 猜賽果（改為從 Sheet 抽樣）====================
	var gameState = { current:null, played:0, hits:0, waiting:false, lastGuess:null, totalPnl:0, skipsUsed:0 };
	
	function getMaxSkips() { return 2 + Math.floor(gameState.played / 10); }
	function getRemainingSkips() { return getMaxSkips() - gameState.skipsUsed; }
	function updateSkipDisplay() {
	  var infoEl = document.getElementById('gameSkipInfo');
	  var btn = document.getElementById('gbtnSkip');
	  if (!infoEl) return;
	  var t = translations[currentLang];
	  var remaining = getRemainingSkips();
	  infoEl.textContent = (t.gameSkipInfoPrefix || '剩 ') + remaining + (t.gameSkipInfoSuffix || ' 次');
	  if (remaining <= 0) { infoEl.classList.add('exhausted'); if (btn) btn.disabled = true; }
	  else { infoEl.classList.remove('exhausted'); if (btn) btn.disabled = false; }
	}
	
	// 從 Pool 隨機抽一場
	function generateMatch() {
	  if (!sheetMatchPool || sheetMatchPool.length === 0) return null;
	  var idx = Math.floor(Math.random() * sheetMatchPool.length);
	  var m = sheetMatchPool[idx];
	  // 回傳副本，避免日後誤改原始數據
	  return {
	    hw: m.hw, dw: m.dw, aw: m.aw,
	    ho: m.ho, doo: m.doo, ao: m.ao,
	    score: m.score, result: m.result
	  };
	}
	
	function displayMatch(m) {
	  if (!m) return;
	  document.getElementById('ghw').textContent = m.hw + '%';
	  document.getElementById('gdw').textContent = m.dw + '%';
	  document.getElementById('gaw').textContent = m.aw + '%';
	  document.getElementById('gho').textContent = (m.ho / 100).toFixed(2);
	  document.getElementById('gdoo').textContent = (m.doo / 100).toFixed(2);
	  document.getElementById('gao').textContent = (m.ao / 100).toFixed(2);

	function showGameMessage(msg, isError) {
	  var resultBox = document.getElementById('gameResult');
	  resultBox.style.display = 'block';
	  resultBox.className = 'game-result-box';
	  resultBox.style.background = isError ? 'rgba(248,113,113,0.15)' : 'rgba(156,163,175,0.15)';
	  resultBox.style.color = isError ? '#dc2626' : 'var(--text-secondary)';
	  resultBox.style.border = isError ? '1px solid rgba(248,113,113,0.4)' : '1px solid rgba(156,163,175,0.4)';
	  resultBox.innerHTML = msg;
	}
	function clearGameMessage() {
	  var resultBox = document.getElementById('gameResult');
	  resultBox.style.display = 'none';
	  resultBox.style.background = ''; resultBox.style.color = ''; resultBox.style.border = '';
	}
	
	function gameNewRound() {
	  // 若上一局未猜，先提示
	  if (gameState.waiting && gameState.current) {
	    var t = translations[currentLang];
	    showGameMessage(t.gameMustGuess || '⚠️ 請先預測本場答案，才能開始新一局', false);
	    setTimeout(function() { if (gameState.waiting) clearGameMessage(); }, 1800);
	    return;
	  }
	  // 確保 Pool 已載入
	  if (!sheetMatchPool || sheetMatchPool.length === 0) {
	    var tl = translations[currentLang];
	    showGameMessage(tl.gameLoading || '⏳ 載入比賽數據中...', false);
	    ensureSheetPool().then(function(pool) {
	      if (!pool || pool.length === 0) {
	        showGameMessage(tl.gameNoData || '⚠️ 暫無比賽數據', true);
	        return;
	      }
	      gameNewRound();
	    }).catch(function() {
	      showGameMessage(tl.gameLoadError || '⚠️ 載入數據失敗', true);
	    });
	    return;
	  }
	  var m = generateMatch();
	  if (!m) {
	    var t2 = translations[currentLang];
	    showGameMessage(t2.gameNoData || '⚠️ 暫無比賽數據', true);
	    return;
	  }
	  gameState.current = m;
	  gameState.waiting = true;
	  gameState.lastGuess = null;
	  displayMatch(m);
	  clearGameMessage();
	  ['gbtnH','gbtnD','gbtnA','gbtnAuto','gbtnDev'].forEach(function(id){
	    var b = document.getElementById(id);
	    if (b) { b.disabled = false; b.style.opacity = '1'; }
	  });
	  updateSkipDisplay();
	}
	
	function gameSkip() {
	  if (!gameState.waiting || !gameState.current) return;
	  var remaining = getRemainingSkips();
	  if (remaining <= 0) {
	    var t = translations[currentLang];
	    showGameMessage(t.gameSkipExhausted || '❌ 跳過次數已用完', true);
	    setTimeout(function() { if (!gameState.waiting) clearGameMessage(); }, 1500);
	    return;
	  }
	  gameState.skipsUsed++;
	  var tl = translations[currentLang];
	  showGameMessage(tl.gameSkipToast || '⏭️ 已跳過本場', false);
	  setTimeout(function() {
	    var m = generateMatch();
	    if (!m) {
	      showGameMessage(tl.gameNoData || '⚠️ 暫無比賽數據', true);
	      return;
	    }
	    gameState.current = m;
	    gameState.waiting = true;
	    gameState.lastGuess = null;
	    displayMatch(m);
	    clearGameMessage();
	    ['gbtnH','gbtnD','gbtnA','gbtnAuto','gbtnDev'].forEach(function(id){
	      var b = document.getElementById(id);
	      if (b) { b.disabled = false; b.style.opacity = '1'; }
	    });
	    updateSkipDisplay();
	  }, 400);
	  updateSkipDisplay();
	}
	
	function gameAutoPredict() {
	  if (!gameState.waiting || !gameState.current) return;
	  var t = translations[currentLang];
	  var m = gameState.current;
	  var bet = calcBet(m.hw, m.dw, m.aw, m.ho/100, m.doo/100, m.ao/100);
	  if (bet === "skip") {
	    showGameMessage(t.gameAutoSkip || '🤖 系統建議不出手（Skip）', false);
	    setTimeout(function() { if (gameState.waiting) clearGameMessage(); }, 2000);
	    return;
	  }
	  performGuess(bet, true);
	}
	
	function performGuess(bet, isAuto) {
	  var m = gameState.current;
	  if (!m) return;
	  gameState.lastGuess = bet;
	  var result = m.result;
	  var isWin = (bet === result);
	  var roundPnl = 0;
	  if (isWin) {
	    var odds;
	    if (result === "H") odds = m.ho / 100;
	    else if (result === "D") odds = m.doo / 100;
	    else odds = m.ao / 100;
	    roundPnl = Math.round(odds * 100 - 100);
	  } else roundPnl = -100;
	  gameState.played++;
	  if (isWin) gameState.hits++;
	  gameState.totalPnl += roundPnl;
	  gameState.waiting = false;
	  renderGameResult(bet, true, roundPnl, isAuto);
	  ['gbtnH','gbtnD','gbtnA','gbtnAuto','gbtnDev'].forEach(function(id){
	    var b = document.getElementById(id);
	    if (b) { b.disabled = true; b.style.opacity = '0.5'; }
	  });
	  document.getElementById('gamePlayed').textContent = gameState.played;
	  document.getElementById('gameHits').textContent = gameState.hits;
	  var rate = gameState.played > 0 ? (gameState.hits / gameState.played * 100).toFixed(1) + '%' : '—';
	  document.getElementById('gameRate').textContent = rate;
	  updatePnlDisplay();
	  updateTierDisplay(true);
	  updateSkipDisplay();
	}
	
	function gameGuess(guess) {
	  if (!gameState.waiting || !gameState.current) return;
	  performGuess(guess, false);
	}
	
	function devAutoPredict() {
	  if (!devMode) return;
	  if (!sheetMatchPool || sheetMatchPool.length === 0) {
	    ensureSheetPool().then(function() { devAutoPredict(); }).catch(function() {});
	    return;
	  }
	  var m = generateMatch();
	  if (!m) return;
	  gameState.current = m;
	  displayMatch(m);
	  var bet = calcBet(m.hw, m.dw, m.aw, m.ho/100, m.doo/100, m.ao/100);
	  if (bet === "skip") {
	    gameState.current = generateMatch();
	    gameState.waiting = true;
	    gameState.lastGuess = null;
	    if (gameState.current) displayMatch(gameState.current);
	    return;
	  }
	  var result = m.result;
	  var isWin = (bet === result);
	  var odds;
	  if (result === "H") odds = m.ho / 100;
	  else if (result === "D") odds = m.doo / 100;
	  else odds = m.ao / 100;
	  var roundPnl = isWin ? Math.round(odds * 100 - 100) : -100;
	  gameState.played++;
	  if (isWin) gameState.hits++;
	  gameState.totalPnl += roundPnl;
	  gameState.lastGuess = bet;
	  renderGameResult(bet, true, roundPnl, true);
	  document.getElementById('gamePlayed').textContent = gameState.played;
	  document.getElementById('gameHits').textContent = gameState.hits;
	  var rate = gameState.played > 0 ? (gameState.hits / gameState.played * 100).toFixed(1) + '%' : '—';
	  document.getElementById('gameRate').textContent = rate;
	  updatePnlDisplay();
	  updateTierDisplay(true);
	  gameState.current = generateMatch();
	  gameState.waiting = true;
	  gameState.lastGuess = null;
	  if (gameState.current) displayMatch(gameState.current);
	}
	
	function updatePnlDisplay() {
	  var el = document.getElementById('gamePnl');
	  if (!el) return;
	  var v = gameState.totalPnl;
	  if (v > 0) { el.textContent = '+' + v; el.className = 'game-stat-value positive'; }
	  else if (v < 0) { el.textContent = v; el.className = 'game-stat-value negative'; }
	  else { el.textContent = '0'; el.className = 'game-stat-value neutral'; }
	}
	
	function getMatchDescription(result, match) {
	  var t = translations[currentLang];
	  var odds;
	  if (result === "H") odds = match.ho / 100;
	  else if (result === "D") odds = match.doo / 100;
	  else odds = match.ao / 100;
	  if (result === "D") {
	    if (odds >= 8.00) return t.desc_D_extreme || '🎯 超罕見超高賠和局！';
	    if (odds >= 5.00) return t.desc_D_huge || '💰 高賠和局命中！';
	    if (odds >= 3.50) return t.desc_D_high || '📊 中高賠和局';
	    return t.desc_D_normal || '🤝 正常和局';
	  }
	  if (odds >= 10.00) return t.desc_extreme || '💥💥💥 史詩級大爆冷！';
	  if (odds >= 6.00)  return t.desc_huge || '💥💥 大爆冷！';
	  if (odds >= 4.00)  return t.desc_big || '💥 爆冷！';
	  if (odds >= 3.00)  return t.desc_upset || '⚡ 冷門出現！';
	  if (odds >= 2.50)  return t.desc_minor || '📈 小冷門';
	  if (odds >= 1.80)  return t.desc_normal || '✅ 正常賽果';
	  if (odds >= 1.50)  return t.desc_favorite || '🔥 大熱取勝';
	  return t.desc_strong || '💪 大熱輕鬆取勝';
	}
	
	function renderGameResult(guess, animate, roundPnl, isAuto) {
	  if (!gameState.current || !guess) return;
	  var t = translations[currentLang];
	  var result = gameState.current.result;
	  var isWin = (guess === result);
	  var resultText = "";
	  if (result === "H") resultText = t.resultHShort || "主勝";
	  else if (result === "D") resultText = t.resultDShort || "和局";
	  else resultText = t.resultAShort || "客勝";
	  var guessText = "";
	  if (guess === "H") guessText = t.resultHShort || "主勝";
	  else if (guess === "D") guessText = t.resultDShort || "和局";
	  else guessText = t.resultAShort || "客勝";
	  var desc = getMatchDescription(result, gameState.current);
	  if (roundPnl === undefined || roundPnl === null) {
	    if (isWin) {
	      var odds;
	      if (result === "H") odds = gameState.current.ho / 100;
	      else if (result === "D") odds = gameState.current.doo / 100;
	      else odds = gameState.current.ao / 100;
	      roundPnl = Math.round(odds * 100 - 100);
	    } else roundPnl = -100;
	  }
	  var pnlText = roundPnl >= 0 ? '+' + roundPnl : '' + roundPnl;
	  var pnlLabel = isWin ? (t.gameProfit || '本局盈利') : (t.gameLoss || '本局虧損');
	  var autoLabel = isAuto ? '🤖 ' : '';
	  // 比分（可選顯示）
	  var scoreStr = gameState.current.score ? String(gameState.current.score).trim() : '';
	  var scoreLine = scoreStr ? ('<br>' + (t.gameScoreLabel || '⚽ 比分') + '：<b>' + scoreStr + '</b>') : '';
	  var resultBox = document.getElementById('gameResult');
	  resultBox.style.display = 'block';
	  resultBox.className = 'game-result-box ' + (isWin ? 'game-win' : 'game-lose');
	  resultBox.style.background = ''; resultBox.style.color = ''; resultBox.style.border = '';
	  resultBox.innerHTML = autoLabel + (isWin ? (t.gameWin || '🎉 恭喜！答中！') : (t.gameLose || '❌ 差啲！答錯'))
	    + '<span class="pnl-big">' + pnlText + '</span>'
	    + '<small>' + pnlLabel + '（' + (t.gameStake || '注碼 $100') + '）<br>'
	    + desc
	    + scoreLine + '<br>'
	    + (t.gameAnswer || '正確答案') + '：<b>' + resultText + '</b>'
	    + '　|　' + (t.gameYourGuess || '你的選擇') + '：' + guessText + '</small>';
	}
	
	// ==================== Tier ====================
	function getTier(rate) {
	  if (rate >= 70)   return { tier:'EX', descKey:'tierEX' };
	  if (rate >= 67.5) return { tier:'S+', descKey:'tierS' };
	  if (rate >= 65)   return { tier:'S',  descKey:'tierS' };
	  if (rate >= 62.5) return { tier:'S-', descKey:'tierS' };
	  if (rate >= 60)   return { tier:'A+', descKey:'tierA' };
	  if (rate >= 57.5) return { tier:'A',  descKey:'tierA' };
	  if (rate >= 55)   return { tier:'A-', descKey:'tierA' };
	  if (rate >= 52.5) return { tier:'C+', descKey:'tierC' };
	  if (rate >= 50)   return { tier:'C',  descKey:'tierC' };
	  if (rate >= 47.5) return { tier:'C-:'', descKey:'tierC'0 };
	  if (rate >= 45)    return { tier:'D0+', desc Key:'tierD' };
	  if (rate >= 42.5) return { tier:'D',  descKey:'tierD' };
	  if (rate >= 40)   return { tier:'D-', descKey:'tierD' };
	  if (rate >= 37.5) return { tier:'E+', descKey:'tierE' };
	  if (rate > 35)    return { tier:'E',  descKey:'tierE' };
	  return { tier:'E-', descKey:'tierE' };
	}
	
	function updateTierDisplay(withAnimation) {
	  var tierEl = document.getElementById('gameTier');
	  if (!tierEl) return;
	  if (gameState.played < 10) { tierEl.style.display = 'none'; return; }
	  var rate = (gameState.hits / gameState.played) * 100;
	  var tier = getTier(rate);
	  var t = translations[currentLang];
	  var badgeEl = document.getElementById('tierBadge');
	  var descEl = document.getElementById('tierDesc');
	  var isNewTier = badgeEl.getAttribute('data-tier') !== tier.tier;
	
	  var colorMap = {
	    'EX': { color:'#c084fc', bg:'rgba(192,132,252,0.18)', border:'rgba(192,132,252,0.65)', shadow:'0 0 50px rgba(192,132,252,0.6)', isEX:true },
	    'S+': { color:'#FFD700', bg:'rgba(255,215,0,0.15)', border:'rgba(255,215,0,0.75)', shadow:'0 0 40px rgba(255,215,0,0.55)' },
	    'S':  { color:'#FFD700', bg:'rgba(255,215,0,0.15)', border:'rgba(255,215,0,0.75)', shadow:'0 0 40px rgba(255,215,0,0.55)' },
	    'S-': { color:'#FFD700', bg:'rgba(255,215,0,0.15)', border:'rgba(255,215,0,0.75)', shadow:'0 0 40px rgba(255,215,0,0.55)' },
	    'A+': { color:'#60a5fa', bg:'rgba(96,165,250,0.18)', border:'rgba(96,165,250,0.65)', shadow25px rgba(96,165,250,0.3)' },
	    'A':  { color:'#60a5fa', bg:'rgba(96,165,250,0.18)', border:'rgba(96,165,250,0.65)', shadow:'0 0 25px rgba(96,165,250,0.3)' },
	    'A-': { color:'#60a5fa', bg:'rgba(96,165,250,0.18)', border:'rgba(96,165,250,0.65)', shadow:'0 0 25px rgba(96,165,250,0.3)' },
	    'C+': { color:'#fbbf24', bg:'rgba(251,191,36,0.18)', border:'rgba(251,191,36,0.65)', shadow:'0 0 18px rgba(251,191,36,0.2)' },
	    'C':  { color:'#fbbf24', bg:'rgba(251,191,36,0.18)', border:'rgba(251,191,36,0.65)', shadow:'0 0 18px rgba(251,191,36,0.2)' },
	    'C-': { color:'#fbbf24', bg:'rgba(251,191,36,0.18)', border:'rgba(251,191,36,0.65)', shadow:'0 0 18px rgba(251,191,36,0.2)' },
	    'D+': { color:'#f87171', bg:'rgba(248,113,113,0.18)', border:'rgba(248,113,113,0.65)', shadow:'0 0 15px rgba(248,113,113,0.2)' },
	    'D':  { color:'#f87171', bg:'rgba(248,113,113,0.18)', border:'rgba(248,113,113,0.65)', shadow:'0 0 15px rgba(248,113,113,0.2)' },
	    'D-': { color:'#f87171', bg:'rgba(248,113,113,0.18)', border:'rgba(248,113,113,0.65)', shadow:'0 0 15px rgba(248,113,113,0.2)' },
	    'E+': { color:'#9ca3af', bg:'rgba(156,163,175,0.18)', border:'rgba(156,163,175,0.65)', shadow:'none' },
	    'E':  { color:'#9ca3af', bg:'rgba(156,163,175,0.18)', border:'rgba(156,163,175,0.65)', shadow:'none' },
	    'E-': { color:'#9ca3af', bg:'rgba(156,163,175,0.18)', border:'rgba(156,163,175,0.65)', shadow:'none' }
	  };
	  var style = colorMap[tier.tier] || colorMap['E'];
	
	  badgeEl.style.display = 'inline-block';
	  badgeEl.style.padding = '18px 42px';
	  badgeEl.style.borderRadius = '16px';
	  badgeEl.style.fontSize = '52px';
	  badgeEl.style.fontWeight = '900';
	  badgeEl.style.letterSpacing = '3px';
	  badgeEl.style.lineHeight = '1';
	  badgeEl.style.minWidth = '150px';
	  badgeEl.style.fontFamily = "'Segoe UI', -apple-system, sans-serif";
	  badgeEl.style.border = '2px solid ' + style.border;
	  badgeEl.style.boxShadow = style.shadow;
	  badgeEl.textContent = tier.tier;
	  badgeEl.setAttribute('data-tier', tier.tier);
	
	  if (style.isEX) {
	    badgeEl.style.background = 'linear-gradient(135deg, #c084fc, #a78bfa, #818cf8, #e879f9, #c084fc, #a78bfa)';
	    badgeEl.style.backgroundSize = '400% 400%';
	    badgeEl.style.color = '#fff';
	    badgeEl.style.textShadow = '0 0 20px #c084fc, 0 0 40px #a78bfa, 0 0 60px #e879f9';
	    badgeEl.style.animation = 'tierEXGradient 2s ease infinite, tierPulse 2.5s ease-in-out infinite';
	  } else if (tier.tier.indexOf('S') === 0) {
	    badgeEl.style.background = style.bg;
	    badgeEl.style.color = style.color;
	    badgeEl.style.textShadow = '0 0 15px ' + style.color + ', 0 0 30px ' + style.color + ', 0 2px 12px ' + style.color;
	    if (isNewTier || !badgeEl.style.animation) badgeEl.style.animation = 'tierPulse 2.5s ease-in-out infinite';
	  } else {
	    badgeEl.style.background = style.bg;
	    badgeEl.style.color = style.color;
	    badgeEl.style.textShadow = '0 2px 12px ' + style.color;
	    if (isNewTier || !badgeEl.style.animation) badgeEl.style.animation = 'tierPulse 2.5s ease-in-out infinite';
	  }
	
	  descEl.style.fontSize = '14px';
	  descEl.style.marginTop = '12px';
	  descEl.style.fontWeight = 'bold';
	  descEl.style.letterSpacing = '0.5px';
	  descEl.style.color = style.isEX ? '#c084fc' : style.color;
	  descEl.textContent = t[tier.descKey] || '';
	
	  tierEl.style.display = 'block';
	  tierEl.style.textAlign = 'center';
	  tierEl.style.marginBottom = '20px';
	  tierEl.style.padding = '20px 15px';
	  tierEl.style.borderRadius = '14px';
	  tierEl.style.background = 'var(--bg-panel)';
	  tierEl.style.border = '1px solid var(--border-color)';
	
	  if (withAnimation && isNewTier) {
	    badgeEl.style.animation = 'tierPop 0.6s ease-out, ' + (style.isEX ? 'tierEXGradient 2s ease infinite, ' : '') + 'tierPulse 2.5s ease-in-out 0.6s infinite';
	    setTimeout(function() {
	      if (style.isEX) badgeEl.style.animation = 'tierEXGradient 2s ease infinite, tierPulse 2.5s ease-in-out infinite';
	      else badgeEl.style.animation = 'tierPulse 2.5s ease-in-out infinite';
	    }, 700);
	  }
	}
	
	// ==================== 綁定所有事件 ====================
	window.addEventListener('load', function() {
	  var savedTheme = 'dark';
	  try { savedTheme = localStorage.getItem('qfp_theme') || 'dark'; } catch(e) {}
	  applyTheme(savedTheme);
	
	  var themeBtn = document.getElementById('themeSwitcher');
	  if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
	
	  var langSel = document.getElementById('langSelect');
	  if (langSel) langSel.addEventListener('change', function() { changeLang(this.value); });
	
	  window.addEventListener('scroll', handleTopBtnsScroll, { passive: true });
	  window.addEventListener('touchmove', handleTopBtnsScroll, { passive: true });
	  handleTopBtnsScroll();
	
	  var s = document.getElementById('termsScroll');
	  if (s) {
	    s.addEventListener('scroll', updateAgreeBtnVisual);
	    s.addEventListener('touchmove', updateAgreeBtnVisual);
	    s.addEventListener('touchend', updateAgreeBtnVisual);
	    s.addEventListener('wheel', updateAgreeBtnVisual, { passive: true });
	    setTimeout(function() {
	      if (s.scrollHeight <= s.clientHeight + 200) {
	        var btn = document.getElementById('agreeBtn');
	        if (btn) btn.classList.add('active');
	        updateAgreeBtnText();
	      }
	    }, 300);
	    setInterval(function() {
	      if (s.scrollTop + s.clientHeight >= s.scrollHeight - 200) {
	        var btn = document.getElementById('agreeBtn');
	        if (btn && !btn.classList.contains('active')) {
	          btn.classList.add('active');
	          updateAgreeBtnText();
	        }
	      }
	    }, 400);
	  }
	  window.addEventListener('resize', updateAgreeBtnVisual);
	  updateAgreeBtnText();
	
	  var agreeBtn = document.getElementById('agreeBtn');
	  if (agreeBtn) agreeBtn.addEventListener('click', handleAgree);
	
	  ['hw','dw','aw'].forEach(function(id) {
	    var el = document.getElementById(id);
	    if (el) el.addEventListener('input', function() {
	      this.value = this.value.replace(/[^0-9]/g, '');
	      checkClearBtn();
	    });
	  });
	  ['ho','doo','ao'].forEach(function(id) {
	    var el = document.getElementById(id);
	    if (el) {
	      el.addEventListener('input', function() { formatOddsInput(this); checkClearBtn(); });
	      el.addEventListener('blur', function() { formatOddsOnBlur(this); });
	    }
	  });
	
	  var calcBtn = document.getElementById('calcBtn');
	  if (calcBtn) calcBtn.addEventListener('click', calculate);
	  var clearBtn = document.getElementById('clearBtn');
	  if (clearBtn) clearBtn.addEventListener('click', clearData);
	
	  var gbtnH = document.getElementById('gbtnH');
	  if (gbtnH) gbtnH.addEventListener('click', function() { gameGuess('H'); });
	  var gbtnD = document.getElementById('gbtnD');
	  if (gbtnD) gbtnD.addEventListener('click', function() { gameGuess('D'); });
	  var gbtnA = document.getElementById('gbtnA');
	  if (gbtnA) gbtnA.addEventListener('click', function() { gameGuess('A'); });
	  var gbtnAuto = document.getElementById('gbtnAuto');
	  if (gbtnAuto) gbtnAuto.addEventListener('click', gameAutoPredict);
	  var gbtnDev = document.getElementById('gbtnDev');
	  if (gbtnDev) gbtnDev.addEventListener('click', devAutoPredict);
	  var gbtnSkip = document.getElementById('gbtnSkip');
	  if (gbtnSkip) gbtnSkip.addEventListener('click', gameSkip);
	  var gbtnNew = document.getElementById('gameNewBtn');
	  if (gbtnNew) gbtnNew.addEventListener('click', gameNewRound);
	
	  var devUnlockBtn = document.getElementById('devUnlockBtn');
	  if (devUnlockBtn) devUnlockBtn.addEventListener('click', devUnlock);
	  var devApplyBtn = document.getElementById('devApplyBtn');
	  if (devApplyBtn) devApplyBtn.addEventListener('click', applyParams);
	  var devResetBtn = document.getElementById('devResetBtn');
	  if (devResetBtn) devResetBtn.addEventListener('click', resetParams);
	
	  applyLanguage('zh-HK');
	  checkClearBtn();
	  loadSavedParams();
	  loadStatsWithRetry();
	  setInterval(loadStatsWithRetry, 15000);
	  window.addEventListener('focus', loadStatsWithRetry);
	  document.addEventListener('visibilitychange', function() { if (!document.hidden) loadStatsWithRetry(); });
	
	  // 預先載入比賽 Pool（背景執行，進場時即有數據）
	  ensureSheetPool().catch(function(e) { console.warn('Pool preload failed:', e); });
	});
</script>
